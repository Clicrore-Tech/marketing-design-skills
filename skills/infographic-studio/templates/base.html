<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Infographic Studio starter. Style: results-board. Preset: feed (1080x1350). -->
<!-- Composition: hero number on the board, support row below, CTA strip at the base. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Oswald:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --w: 1080px; --h: 1350px;
    --bg: #1B2A41; --bg2: #26395A; --board: #5A3A22;
    --ink: #F7F3E8; --muted: #B9C2D3; --accent: #E8B931;
    --d1: #E8B931; --d2: #7FB7E6; --d3: #E37A5B; --d4: #9CCB8A;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 40px; --s5: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg) 70%);
    color: var(--ink); font-family: Inter, sans-serif; overflow: hidden; position: relative;
  }
  header { padding: var(--s5) var(--s5) 0; text-align: center; }
  .eyebrow { font: 600 26px Inter; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  h1 { font: 700 72px/1.05 Cinzel, serif; margin-top: var(--s2); }
  .board {
    margin: var(--s4) var(--s5) 0; padding: var(--s4); border-radius: 12px;
    background: var(--board); border: 3px solid var(--accent);
    box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 0 0 8px rgba(0,0,0,.15);
    text-align: center;
  }
  .hero-num { font: 600 230px/1 Oswald, sans-serif; color: var(--accent); }
  .hero-num .unit { display: block; font: 600 44px Inter; color: var(--ink); margin-top: var(--s2); letter-spacing: .04em; }
  .support { display: flex; gap: var(--s3); margin: var(--s4) var(--s5) 0; }
  .support > div { flex: 1; text-align: center; }
  .support .n { font: 600 64px Oswald; }
  .support .l { font: 400 24px/1.3 Inter; color: var(--muted); }
  .cta {
    position: absolute; left: 0; right: 0; bottom: 0; height: 170px;
    background: var(--accent); color: #1B2A41; display: flex; align-items: center;
    justify-content: space-between; padding: 0 var(--s5);
  }
  .cta .ask { font: 700 34px/1.15 Inter; }
  .cta .phone { font: 600 52px Oswald; }
  .source { position: absolute; bottom: 182px; left: var(--s5); font: 400 18px Inter; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">2026 in numbers</div>
    <h1>A year worth celebrating</h1>
  </header>
  <section class="board">
    <div class="hero-num" data-hero>38,000<span class="unit">classes booked (SAMPLE)</span></div>
  </section>
  <section class="support">
    <div><div class="n" style="color:var(--d2)">1,240</div><div class="l">members</div></div>
    <div><div class="n" style="color:var(--d3)">4.9</div><div class="l">average rating</div></div>
    <div><div class="n" style="color:var(--d4)">6.2 kg</div><div class="l">avg. 90-day result</div></div>
  </section>
  <div class="source">Source: booking system and Google reviews, Jan to Dec 2026. SAMPLE DATA.</div>
  <footer class="cta">
    <div class="ask">First class free<br>this month</div>
    <div class="phone">98450 00000</div>
  </footer>
</body>
</html>
